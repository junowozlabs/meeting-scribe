name: Test and build
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build app bundle
        run: script/package-app.sh
      - name: Archive app preserving framework symlinks
        run: ditto -c -k --keepParent dist/MeetingScribe.app dist/MeetingScribe.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MeetingScribe-build
          path: dist/MeetingScribe.zip
